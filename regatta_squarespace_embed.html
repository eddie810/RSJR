  const to=(fromDeg+180)*Math.PI/180, sx=Math.sin(to), sy=-Math.cos(to);
  const L=size, hx=sx*L, hy=sy*L;
  g.appendChild(E(&quot;line&quot;,{x1:-hx*.6,y1:-hy*.6,x2:hx,y2:hy,class:cls,&quot;stroke-width&quot;:2}));
  const a1=to+Math.PI*0.8,a2=to-Math.PI*0.8,hl=size*0.5;
  g.appendChild(E(&quot;path&quot;,{d:`M${hx},${hy} L${hx+Math.sin(a1)*hl},${hy-Math.cos(a1)*hl} L${hx+Math.sin(a2)*hl},${hy-Math.cos(a2)*hl} Z`,fill:`var(${cls==='arw-r'?'--red':'--water'})`,stroke:&quot;none&quot;}));
  return g;
}

// ---------- wave chart at buoys ----------
(function(){const svg=document.getElementById(&quot;wave&quot;);const W=980,H=230,padL=44,padR=70;

  const hi=Math.max(12,Math.max(...vals)*1.25), pt=40, pb=H-34;
  const y=v=>pb-(v/hi)*(pb-pt);

  const si=ROW.map((d,i)=>d.dow===&quot;2026-07-11&quot;?i:-1).filter(i=>i>=0);

  [0,Math.round(hi/2),Math.round(hi)].forEach(v=>{svg.appendChild(E(&quot;text&quot;,{x:padL-6,y:y(v)+3,&quot;text-anchor&quot;:&quot;end&quot;,class:&quot;tick&quot;},v));});

    svg.appendChild(E(&quot;path&quot;,{d,class:cls}));

  ROW.forEach((o,i)=>{ if(o.hour%6!==0)return; const h=o.hour,lab=(h===0?o.day+&quot; 12a&quot;:h===12?&quot;12p&quot;:h+&quot;&quot;);

// ---------- technical meteogram (compact, from earlier build) ----------
(function(){const svg=document.getElementById(&quot;svg&quot;);const W=1040,padL=46,padR=92;
  const n=DATA.length, px=i=>padL+i*(W-padL-padR)/(n-1);
  const L={temp:{y:120,h:96,title:&quot;Temperature °C&quot;},wind:{y:300,h:110,title:&quot;Wind km/h&quot;},cloud:{y:450,h:70,title:&quot;Cloud %&quot;},
    strip:{y:54,h:36}, aw:{twc:250,rdps:272}};
  const H=560; svg.setAttribute(&quot;viewBox&quot;,`0 0 ${W} ${H}`);
  const satIdx=DATA.map((d,i)=>d.dow===&quot;2026-07-11&quot;?i:-1).filter(i=>i>=0);
  if(satIdx.length){const a=px(satIdx[0])-(px(1)-px(0))/2,b=px(satIdx[satIdx.length-1])+(px(1)-px(0))/2;
    svg.appendChild(E(&quot;rect&quot;,{x:a,y:L.strip.y-6,width:b-a,height:L.cloud.y+L.cloud.h-L.strip.y+8,class:&quot;band-sat&quot;}));}
  let last=null;DATA.forEach((d,i)=>{if(d.dow!==last){last=d.dow;if(i>0){const x=px(i)-(px(1)-px(0))/2;
    svg.appendChild(E(&quot;line&quot;,{x1:x,y1:L.strip.y-6,x2:x,y2:L.cloud.y+L.cloud.h,class:&quot;grid-line&quot;}));}
    svg.appendChild(E(&quot;text&quot;,{x:px(i)+4,y:L.strip.y-20,class:&quot;daylab&quot;},d.day+&quot; &quot;+d.dow.slice(8)));}});
  function panel(p,series,fmt,zero){const vs=[];series.forEach(s=>DATA.forEach(d=>{const v=s.get(d);if(v!=null)vs.push(v);}));
    let lov=Math.min(...vs),hiv=Math.max(...vs);const pad=(hiv-lov)*.15||1;lov=zero?0:lov-pad;hiv+=pad;
    const y=v=>p.y+p.h-(v-lov)/(hiv-lov)*p.h;
    for(let t=0;t<=2;t++){const gv=lov+(hiv-lov)*t/2,yy=y(gv);svg.appendChild(E(&quot;line&quot;,{x1:padL,y1:yy,x2:W-padR,y2:yy,class:&quot;grid-line&quot;}));
      svg.appendChild(E(&quot;text&quot;,{x:padL-6,y:yy+3,&quot;text-anchor&quot;:&quot;end&quot;,class:&quot;tick&quot;},fmt(gv)));}
    svg.appendChild(E(&quot;text&quot;,{x:padL,y:p.y-9,class:&quot;ptitle&quot;},p.title));
    series.forEach(s=>{let d=&quot;&quot;,st=false;DATA.forEach((o,i)=>{const v=s.get(o);if(v==null){st=false;return;}d+=(st?&quot;L&quot;:&quot;M&quot;)+px(i)+&quot;,&quot;+y(v)+&quot; &quot;;st=true;});

  panel(L.temp,[{get:d=>d.twc.temp,cls:&quot;ln-twc&quot;,vc:&quot;--twc&quot;,lab:&quot;TWC&quot;},{get:d=>d.rdps.temp,cls:&quot;ln-rdps&quot;,vc:&quot;--rdps&quot;,lab:&quot;RDPS&quot;}],v=>v.toFixed(0));
  panel(L.wind,[{get:d=>d.twc.wspd,cls:&quot;ln-twc&quot;,vc:&quot;--twc&quot;,lab:&quot;TWC&quot;},{get:d=>d.rdps.wspd,cls:&quot;ln-rdps&quot;,vc:&quot;--rdps&quot;,lab:&quot;RDPS&quot;},{get:d=>d.rdps.gust,cls:&quot;ln-gust&quot;,vc:&quot;--gust&quot;,lab:&quot;gust&quot;}],v=>v.toFixed(0),true);
  // direction arrows
  svg.appendChild(E(&quot;text&quot;,{x:padL,y:L.aw.twc-8,class:&quot;ptitle&quot;},&quot;Wind direction (arrow = toward)&quot;));
  [[&quot;twc&quot;,L.aw.twc],[&quot;rdps&quot;,L.aw.rdps]].forEach(([src,ry])=>{svg.appendChild(E(&quot;text&quot;,{x:padL-6,y:ry+4,&quot;text-anchor&quot;:&quot;end&quot;,class:&quot;rowlab&quot;},src.toUpperCase()));
    DATA.forEach((d,i)=>{if(i%2!==0&amp;&amp;i!==n-1)return;const dir=d[src].wdir;if(dir==null)return;
      const to=(dir+180)*Math.PI/180,ux=Math.sin(to),uy=-Math.cos(to),cx=px(i),len=6;const west=dir>=200&amp;&amp;dir<=340;
      const col=west?&quot;var(--red)&quot;:&quot;var(--water)&quot;;
      svg.appendChild(E(&quot;line&quot;,{x1:cx-ux*len,y1:ry-uy*len,x2:cx+ux*len,y2:ry+uy*len,class:&quot;arrow&quot;,stroke:col}));
      const a1=to+Math.PI*.82,a2=to-Math.PI*.82,hx=cx+ux*len,hy=ry+uy*len;
      svg.appendChild(E(&quot;path&quot;,{d:`M${hx},${hy} L${hx+Math.sin(a1)*4},${hy-Math.cos(a1)*4} L${hx+Math.sin(a2)*4},${hy-Math.cos(a2)*4} Z`,fill:col}));});});
  // conditions strip
  const pb=L.strip.y+L.strip.h;svg.appendChild(E(&quot;text&quot;,{x:padL,y:L.strip.y-8,class:&quot;ptitle&quot;},&quot;Sky &amp; shower chance&quot;));
  DATA.forEach((d,i)=>{const pop=d.twc.pop||0,bh=pop/100*L.strip.h*.8,bw=(px(1)-px(0))*.5;

  // cloud
  const cp=L.cloud,cy=v=>cp.y+cp.h-(v/100)*cp.h;svg.appendChild(E(&quot;text&quot;,{x:padL,y:cp.y-9,class:&quot;ptitle&quot;},cp.title));

  let area=&quot;M&quot;+px(0)+&quot;,&quot;+(cp.y+cp.h)+&quot; &quot;,ln=&quot;&quot;;DATA.forEach((d,i)=>{const v=d.twc.cloud||0;area+=&quot;L&quot;+px(i)+&quot;,&quot;+cy(v)+&quot; &quot;;ln+=(i?&quot;L&quot;:&quot;M&quot;)+px(i)+&quot;,&quot;+cy(v)+&quot; &quot;;});

    svg.appendChild(E(&quot;text&quot;,{x:px(i),y:axY+16,&quot;text-anchor&quot;:&quot;middle&quot;,class:&quot;tick&quot;},lab));});
})();
